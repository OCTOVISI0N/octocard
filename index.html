<style>
  :root{
    --navy-950:#052226;
    --navy-900:#063339;
    --navy-800:#04555C;
    --navy-700:#0d6b73;
    --navy-600:#23838c;
    --gold-500:#e2703f;
    --gold-600:#c15c30;
    --paper:#f3f5f3;
    --paper-raised:#fffefb;
    --ink:#17262a;
    --ink-soft:#56676a;
    --hairline:#d7ded8;
    --hairline-dark:rgba(255,255,255,.16);
  }
  *,*::before,*::after{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    background:var(--paper);
    box-shadow:0 0 60px rgba(4,24,44,.12);
    display:flex;
    flex-direction:column;
    position:relative;
  }
  a{color:inherit;}
  button{font:inherit;}

  /* ---- shared ---- */
  .brandbar{
    background:var(--navy-800);
    color:#fff;
    padding:calc(22px + env(safe-area-inset-top)) 24px 20px;
    display:flex;
    align-items:center;
    gap:14px;
  }
  .brandbar img{
    width:34px;height:34px;border-radius:8px;flex:none;
    box-shadow:0 0 0 1px rgba(255,255,255,.15);
  }
  .brandbar .wordmark{
    font-family:'Source Serif 4',serif;
    font-weight:600;
    font-size:17px;
    letter-spacing:.2px;
    line-height:1.15;
  }
  .brandbar .grouptag{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:#b9c9dc;
    margin-top:3px;
  }
  .brandbar-link{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;background:none;border:none;padding:0;cursor:pointer;text-align:left;}

  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }

  /* ---- HOME ---- */
  .home-hero{
    padding:20px 24px 6px;
  }
  .home-hero .slogan{
    font-family:'Source Serif 4',serif;
    font-style:italic;
    font-size:15px;
    color:var(--navy-800);
    margin:6px 0 0;
    line-height:1.4;
  }
  .home-list{
    padding:18px 24px 24px;
    display:flex;
    flex-direction:column;
    gap:10px;
    flex:1;
  }
  .person-card{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--paper-raised);
    border:1px solid var(--hairline);
    border-radius:14px;
    padding:12px 14px;
    text-align:left;
    cursor:pointer;
    transition:border-color .15s ease, transform .15s ease;
  }
  .person-card:hover{border-color:var(--gold-600);}
  .person-card:active{transform:scale(.99);}
  .avatar{
    width:52px;height:52px;border-radius:50%;
    object-fit:cover;flex:none;
    box-shadow:0 0 0 2px var(--paper-raised),0 0 0 3px var(--navy-800);
  }
  .avatar-fallback{
    width:52px;height:52px;border-radius:50%;flex:none;
    background:var(--navy-800);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-family:'Source Serif 4',serif;font-weight:600;font-size:17px;
    box-shadow:0 0 0 2px var(--paper-raised),0 0 0 3px var(--navy-800);
  }
  .person-meta{flex:1;min-width:0;}
  .person-meta .pname{
    font-family:'Source Serif 4',serif;font-weight:600;font-size:17px;
    color:var(--ink);
  }
  .person-meta .prole{
    font-family:'IBM Plex Mono',monospace;font-size:11px;
    letter-spacing:.06em;text-transform:uppercase;
    color:var(--ink-soft);margin-top:2px;
  }
  .qr-hint{
    flex:none;width:34px;height:34px;border-radius:9px;
    background:var(--paper);border:1px solid var(--hairline);
    display:flex;align-items:center;justify-content:center;
    color:var(--navy-800);
  }
  .home-foot{
    margin-top:auto;
    padding:16px 24px 22px;
    border-top:1px solid var(--hairline);
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;color:var(--ink-soft);
    line-height:1.6;
  }

  /* ---- QR VIEW ---- */
  .qr-view{
    background:var(--navy-950);
    color:#fff;
    flex:1;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  .qr-topbar{
    padding:calc(20px + env(safe-area-inset-top)) 22px 0;
  }
  .backbtn{
    background:none;border:none;color:#dbe6f2;
    font-family:'IBM Plex Mono',monospace;font-size:12px;
    letter-spacing:.06em;text-transform:uppercase;
    display:inline-flex;align-items:center;gap:6px;
    cursor:pointer;padding:12px 4px 12px 0;
    margin:-4px 0;
    min-height:44px;
  }
  .qr-person{
    padding:8px 24px 0;
    display:flex;flex-direction:column;align-items:center;text-align:center;
  }
  .qr-person img{
    width:64px;height:64px;border-radius:50%;object-fit:cover;
    box-shadow:0 0 0 3px var(--navy-950),0 0 0 4px var(--gold-500);
    margin-bottom:12px;
  }
  .qr-person .pname{
    font-family:'Source Serif 4',serif;font-weight:600;font-size:20px;
  }
  .qr-person .prole{
    font-family:'IBM Plex Mono',monospace;font-size:11px;
    letter-spacing:.08em;text-transform:uppercase;color:#9fb2c8;
    margin-top:4px;
  }
  .qr-stage{
    flex:1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;
    padding:24px 24px 8px;
  }
  .qr-seal{
    background:#fff;
    border-radius:18px;
    padding:20px;
    position:relative;
    box-shadow:0 18px 40px rgba(0,0,0,.35);
  }
  .qr-seal::after{
    content:'';
    position:absolute;inset:10px;
    border:1px dashed rgba(0,48,96,.25);
    border-radius:11px;
    pointer-events:none;
  }
  #qrcanvas{line-height:0;}
  #qrcanvas img,#qrcanvas canvas,#qrcanvas table{display:block;}
  .qr-caption{
    font-size:13.5px;color:#c3d1e0;text-align:center;max-width:280px;line-height:1.5;
  }
  .qr-link-row{
    display:flex;align-items:center;gap:8px;
    background:rgba(255,255,255,.06);
    border:1px solid var(--hairline-dark);
    border-radius:10px;
    padding:9px 10px;
    max-width:320px;width:100%;
  }
  .qr-link-row input{
    flex:1;min-width:0;background:none;border:none;color:#dbe6f2;
    font-family:'IBM Plex Mono',monospace;font-size:11px;
    outline:none;
  }
  .copybtn{
    flex:none;background:var(--gold-500);color:var(--navy-950);
    border:none;border-radius:7px;padding:7px 10px;
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:500;
    letter-spacing:.04em;cursor:pointer;
  }
  .copybtn:active{background:var(--gold-600);}
  .qr-actions{
    padding:6px 24px 26px;
    display:flex;justify-content:center;
  }
  .ghost-link{
    color:#dbe6f2;text-decoration:none;
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;
    letter-spacing:.05em;text-transform:uppercase;
    border-bottom:1px solid rgba(219,230,242,.4);
    padding-bottom:2px;background:none;border-top:none;border-left:none;border-right:none;cursor:pointer;
  }

  /* ---- PROFILE VIEW ---- */
  .profile-view{flex:1;display:flex;flex-direction:column;}
  .profile-hero{
    padding:30px 24px 22px;
    display:flex;flex-direction:column;align-items:center;text-align:center;
    background:linear-gradient(180deg,var(--navy-800) 0%,var(--navy-800) 62%,var(--paper) 62%);
  }
  .profile-hero img{
    width:112px;height:112px;border-radius:50%;object-fit:cover;
    box-shadow:0 0 0 4px var(--paper),0 0 0 6px var(--gold-500);
    margin-bottom:14px;
  }
  .profile-hero .pname{
    font-family:'Source Serif 4',serif;font-weight:700;font-size:25px;color:var(--ink);
  }
  .profile-hero .prole{
    font-family:'IBM Plex Mono',monospace;font-size:12px;
    letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);
    margin-top:5px;
  }
  .profile-topbar{
    position:absolute;top:0;left:0;right:0;
    display:flex;justify-content:space-between;align-items:center;
    padding:calc(18px + env(safe-area-inset-top)) 22px 0;
    z-index:2;
  }
  .profile-topbar .backbtn{color:#dbe6f2;}
  .save-cta-wrap{padding:18px 24px 4px;}
  .save-cta{
    display:flex;align-items:center;justify-content:center;gap:9px;
    width:100%;
    background:var(--gold-500);color:var(--navy-950);
    text-decoration:none;border:none;cursor:pointer;
    font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:15px;
    padding:13px 18px;border-radius:12px;
    box-shadow:0 8px 20px rgba(199,154,86,.35);
  }
  .save-cta:active{background:var(--gold-600);}
  .save-cta-hint{
    margin:9px 4px 0;text-align:center;
    font-size:11.5px;color:var(--ink-soft);line-height:1.4;
  }
  .rows{
    padding:6px 24px 4px;
    display:flex;flex-direction:column;
  }
  .row{
    display:flex;align-items:center;gap:14px;
    padding:15px 2px;
    border-bottom:1px solid var(--hairline);
    text-decoration:none;color:var(--ink);
    background:none;border-left:none;border-right:none;border-top:none;
    width:100%;text-align:left;cursor:pointer;
  }
  .row:last-child{border-bottom:none;}
  .row-ic{
    flex:none;width:38px;height:38px;border-radius:10px;
    background:var(--paper-raised);border:1px solid var(--hairline);
    display:flex;align-items:center;justify-content:center;color:var(--navy-800);
  }
  .row-text{flex:1;min-width:0;}
  .row-text .rlabel{
    font-family:'IBM Plex Mono',monospace;font-size:10px;
    letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);
  }
  .row-text .rvalue{
    font-size:15.5px;margin-top:2px;
    font-variant-numeric:tabular-nums;
    font-family:'IBM Plex Mono',monospace;
    overflow-wrap:anywhere;
  }
  .row-text .rvalue.prose{font-family:'IBM Plex Sans',sans-serif;font-size:14.5px;line-height:1.4;}
  .row-go{flex:none;color:var(--ink-soft);}

  .profile-slogan{
    margin:10px 24px 0;
    padding:16px 16px;
    border-radius:12px;
    background:var(--navy-800);
    color:#fff;
    font-family:'Source Serif 4',serif;
    font-style:italic;
    font-size:14.5px;
    text-align:center;
    line-height:1.5;
  }
  .profile-foot{
    margin-top:auto;
    padding:20px 24px 26px;
    display:flex;flex-direction:column;align-items:center;gap:10px;
  }
  .profile-foot .grouptag{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;
    letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);
    text-align:center;
  }

  [hidden]{display:none!important;}
  :focus-visible{outline:2px solid var(--gold-600);outline-offset:2px;}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>

  function buildVCard(person){
    var parts = person.name.trim().split(" ");
    var given = parts.slice(0,-1).join(" ") || parts[0];
    var family = parts.length>1 ? parts[parts.length-1] : "";
    var phoneDigits = "+33 " + person.phone.replace(/^0/, "").trim();
    var lines = [
      "BEGIN:VCARD",
      "VERSION:3.0",
      "N:"+family+";"+given+";;;",
      "FN:"+person.name,
      "ORG:"+COMPANY.name,
      "TITLE:"+person.role,
      "TEL;TYPE=WORK,VOICE:"+phoneDigits,
      "EMAIL;TYPE=WORK:"+person.email,
      "URL:"+COMPANY.website,
      "NOTE:"+COMPANY.slogan
    ];
    if (person.vcardPhotoB64){
      lines.push("PHOTO;ENCODING=b;TYPE=JPEG:"+person.vcardPhotoB64);
    }
    lines.push("END:VCARD");
    return lines.join("\r\n");
  }

    for (var i=0;i<PEOPLE.length;i++){ if (PEOPLE[i].slug===s) return PEOPLE[i]; }
    return null;
  }

    u.hash = "";
    return u.toString();
  }

  function copyText(text, btn){
    function done(ok){
      var old = btn.textContent;
      btn.textContent = ok? "Copié" : "Erreur";
      setTimeout(function(){ btn.textContent = old; }, 1400);
    }
    try{
      navigator.clipboard.writeText(text).then(function(){done(true);}, function(){done(false);});
    }catch(e){
      try{
        var ta=document.createElement("textarea");
        ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
        document.body.appendChild(ta); ta.focus(); ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        done(true);
      }catch(e2){ done(false); }
    }
  }

  function isIOS(){
    return /iP(hone|ad|od)/.test(navigator.userAgent) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  }

  function saveContact(person, btn){
    if (!person) return;
    var hint = document.getElementById("save-cta-hint");
    try{
      var vcardText = buildVCard(person);
      var blob = new Blob([vcardText], {type: "text/vcard"});
      var url = URL.createObjectURL(blob);

      if (isIOS()){
        // iOS/Safari (including the home-screen standalone app) opens the
        // native "add contact" sheet only on a direct navigation to a
        // vCard resource — a forced "download" is silently unsupported
        // in standalone mode, so no download attribute here.
        window.location.href = url;
        if (hint) hint.textContent = "Si rien ne s’ouvre automatiquement, réessayez depuis Safari (hors app installée).";
      } else {
        var a = document.createElement("a");
        a.href = url;
        a.download = person.name.replace(/\s+/g, "-") + ".vcf";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        if (hint) hint.textContent = "Le fichier a été téléchargé — ouvrez-le pour l’ajouter à vos contacts.";
      }
      setTimeout(function(){ URL.revokeObjectURL(url); }, 30000);
    }catch(e){
      if (hint) hint.textContent = "Impossible de générer le contact automatiquement — notez les coordonnées ci-dessous.";
    }
  }

  function go(params){
    var u = new URL(window.location.href);
    u.search="";
    Object.keys(params).forEach(function(k){ if(params[k]) u.searchParams.set(k, params[k]); });
    history.pushState({}, "", u.toString());
    render();
  }

  function renderHome(){
    var rows = PEOPLE.map(function(p){
      return '' +
      '<button class="person-card" data-slug="'+p.slug+'">' +
        (p.photo ? '<img class="avatar" src="'+p.photo+'" alt="">' : '<div class="avatar-fallback">'+initials(p.name)+'</div>') +
        '<div class="person-meta">' +
          '<div class="pname">'+esc(p.name)+'</div>' +
          '<div class="prole">'+esc(p.role)+'</div>' +
        '</div>' +
        '<div class="qr-hint">'+iconQrGlyph()+'</div>' +
      '</button>';
    }).join("");

    return '' +
    '<div class="brandbar">' +
      '<img src="'+LOGO+'" alt="">' +
      '<div><div class="wordmark">'+esc(COMPANY.name)+'</div><div class="grouptag">'+esc(COMPANY.websiteLabel)+'</div></div>' +
    '</div>' +
    '<div class="home-hero">' +
      '<div class="eyebrow">Répertoire de contacts</div>' +
      '<p class="slogan">« '+esc(COMPANY.slogan)+' »</p>' +
    '</div>' +
    '<div class="home-list">' + rows + '</div>' +
    '<div class="home-foot">'+esc(COMPANY.websiteLabel)+'</div>';
  }

  function renderQR(person){
    var url = profileUrl(person.slug);
    return '' +
    '<div class="qr-view">' +
      '<div class="qr-topbar"><button class="backbtn" data-nav="home">'+iconArrow()+' Répertoire</button></div>' +
      '<div class="qr-person">' +
        (person.photo ? '<img src="'+person.photo+'" alt="">' : '') +
        '<div class="pname">'+esc(person.name)+'</div>' +
        '<div class="prole">'+esc(person.role)+'</div>' +
      '</div>' +
      '<div class="qr-stage">' +
        '<div class="qr-seal"><div id="qrcanvas"></div></div>' +
        '<p class="qr-caption">Faites scanner ce code pour ouvrir la fiche de contact de '+esc(person.name.split(" ")[0])+'.</p>' +
        '<div class="qr-link-row">' +
          '<input type="text" readonly value="'+esc(url)+'">' +
          '<button class="copybtn" data-copy="'+esc(url)+'">Copier</button>' +
        '</div>' +
      '</div>' +
      '<div class="qr-actions"><button class="ghost-link" data-nav="profile" data-slug="'+person.slug+'">Voir la fiche</button></div>' +
    '</div>';
  }

  function renderProfile(person){
    var telHref = "tel:" + person.phone.replace(/[^0-9+]/g,"");
    return '' +
    '<div class="profile-view">' +
      '<div class="profile-topbar"><button class="backbtn" data-nav="home">'+iconArrow()+' Répertoire</button></div>' +
      '<div class="profile-hero">' +
        (person.photo ? '<img src="'+person.photo+'" alt="">' : '<div class="avatar-fallback" style="width:112px;height:112px;font-size:32px;">'+initials(person.name)+'</div>') +
        '<div class="pname">'+esc(person.name)+'</div>' +
        '<div class="prole">'+esc(person.role)+' · '+esc(COMPANY.name)+'</div>' +
      '</div>' +
      '<div class="save-cta-wrap">' +
        '<button type="button" class="save-cta" data-vcard-slug="'+person.slug+'">'+iconContactAdd()+' Enregistrer le contact</button>' +
        '<p class="save-cta-hint" id="save-cta-hint"></p>' +
      '</div>' +
      '<div class="rows">' +
        '<a class="row" href="'+telHref+'">' +
          '<div class="row-ic">'+iconPhone()+'</div>' +
          '<div class="row-text"><div class="rlabel">Téléphone</div><div class="rvalue">'+esc(person.phone)+'</div></div>' +
          '<div class="row-go">'+iconChevron()+'</div>' +
        '</a>' +
        '<a class="row" href="mailto:'+esc(person.email)+'">' +
          '<div class="row-ic">'+iconMail()+'</div>' +
          '<div class="row-text"><div class="rlabel">Email</div><div class="rvalue">'+esc(person.email)+'</div></div>' +
          '<div class="row-go">'+iconChevron()+'</div>' +
        '</a>' +
        '<a class="row" href="'+esc(COMPANY.website)+'" target="_blank" rel="noopener">' +
          '<div class="row-ic">'+iconWeb()+'</div>' +
          '<div class="row-text"><div class="rlabel">Site web</div><div class="rvalue prose">'+esc(COMPANY.websiteLabel)+'</div></div>' +
          '<div class="row-go">'+iconChevron()+'</div>' +
        '</a>' +
      '</div>' +
      '<p class="profile-slogan">« '+esc(COMPANY.slogan)+' »</p>' +
      '<div class="profile-foot">' +
        '<button class="ghost-link" data-nav="qr" data-slug="'+person.slug+'" style="color:var(--navy-800);border-color:rgba(28,36,48,.35);">'+iconQrGlyph()+' Voir le QR code</button>' +
      '</div>' +
    '</div>';
  }

  function render(){
    var params = new URLSearchParams(window.location.search);
    var slug = params.get("p");
    var view = params.get("view");
    var app = document.getElementById("app");
    var person = slug ? byslug(slug) : null;

    if (person && view === "qr"){
      app.innerHTML = renderQR(person);
      try{
        if (window.QRCode){
          new QRCode(document.getElementById("qrcanvas"), {
            text: profileUrl(person.slug),
            width: 208, height: 208,
            colorDark: "#003060", colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.M
          });
        } else {
          document.getElementById("qrcanvas").innerHTML =
            '<div style="width:208px;height:208px;display:flex;align-items:center;justify-content:center;text-align:center;font-family:IBM Plex Mono,monospace;font-size:11px;color:#5b6473;padding:12px;">QR indisponible hors-ligne — utilisez le lien ci-dessous</div>';
        }
      }catch(e){}
    } else if (person){
      app.innerHTML = renderProfile(person);
    } else {
      app.innerHTML = renderHome();
    }

    app.querySelectorAll("[data-slug].person-card").forEach(function(el){
      el.addEventListener("click", function(){ go({p:this.dataset.slug, view:"qr"}); });
    });
    app.querySelectorAll("[data-nav]").forEach(function(el){
      el.addEventListener("click", function(){
        var nav=this.dataset.nav;
        if(nav==="home") go({});
        else if(nav==="qr") go({p:this.dataset.slug, view:"qr"});
        else if(nav==="profile") go({p:this.dataset.slug});
      });
    });
    var brandLink = app.querySelector(".brandbar-link");
    if(brandLink) brandLink.addEventListener("click", function(){ go({}); });
    app.querySelectorAll("[data-copy]").forEach(function(el){
      el.addEventListener("click", function(){ copyText(this.dataset.copy, this); });
    });
    app.querySelectorAll("[data-vcard-slug]").forEach(function(el){
      el.addEventListener("click", function(){ saveContact(byslug(this.dataset.vcardSlug), this); });
    });
  }

  window.addEventListener("popstate", render);
  render();
})();
</script>
